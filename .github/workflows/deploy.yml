name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Only run when CI succeeded on a push to main.
jobs:
  guard:
    name: Verify CI succeeded
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    steps:
      - run: echo "CI passed for ${{ github.event.workflow_run.head_sha }} — proceeding."

  deploy-backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          response=$(curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render response: $response"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 15
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing VERCEL_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          response=$(curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Vercel response: $response"
